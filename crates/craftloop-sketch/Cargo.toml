craftloop-geometry = { path = "../craftloop-geometry" }
craftloop-recognition = { path = "../craftloop-recognition" }
craftloop-constraint = { path = "../craftloop-constraint" }
# Pinned to an exact version, not a caret range: Phase 11's decision record
# (execution-evidence/solver-evaluations/solver-decision-record.md) flags
# the crates.io name `ezpz` as having been reassigned between two unrelated
# projects in its history, so an unreviewed version bump here is exactly
# the risk that record calls out.
ezpz = "=0.2.29"

[dev-dependencies]
serde_json.workspace = true
