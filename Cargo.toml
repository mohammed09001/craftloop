[workspace]
resolver = "2"
members = [
    "crates/craftloop-ids",
    "crates/craftloop-errors",
    "crates/craftloop-serialization",
    "crates/craftloop-transactions",
    "crates/craftloop-test-support",
    "crates/craftloop-geometry",
    "crates/craftloop-input",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
